---
name: govulncheck
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  govulncheck:
    name: Run govulncheck to identify go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Set up git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5
        with:
          # Scan with the latest Go release so findings reflect this
          # module's dependencies rather than an outdated standard library.
          go-version: stable
          check-latest: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
