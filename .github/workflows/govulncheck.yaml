---
name: govulncheck
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  govulncheck:
    name: Run govulncheck to identify go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Set up git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Scan with the latest Go release so findings reflect this
          # module's dependencies rather than an outdated standard library.
          go-version: stable
          check-latest: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
